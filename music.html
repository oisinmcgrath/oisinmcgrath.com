<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Music — the Oisín Mac Craith YouTube channel.">
  <title>Music — Oisin McGrath</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    /* The channel page, shown at the width of the reading column. */
    .shot{display:block;margin:1.5rem 0;border-radius:10px;overflow:hidden;
          border:2px solid light-dark(#aab8c6,#39424d);line-height:0;
          box-shadow:0 2px 10px light-dark(rgba(20,60,100,.10),rgba(0,0,0,.45))}
    .shot img{display:block;width:100%;height:auto}
    /* YouTube keeps its own red. */
    .ytbtn{display:inline-flex;align-items:center;gap:.6rem;
           padding:.55rem 1rem;border-radius:8px;text-decoration:none;
           font-weight:600;
           border:1px solid light-dark(#e8b3b3,#5b2b2b);
           background:light-dark(#fdf1f1,#241618);
           color:light-dark(#b3261e,#ff8a80);
           transition:border-color .15s,background .15s,box-shadow .15s}
    .ytbtn:hover{border-color:#ff0000;
                 background:light-dark(#fce8e8,#2c1a1c);
                 box-shadow:0 2px 8px light-dark(rgba(179,38,30,.18),rgba(0,0,0,.5))}
    .ytbtn img{width:26px;height:auto;flex:none}

    /* Dark, System or Light, exactly as the homepage does it: `color-scheme`
       on <html> is `light dark` for System, and every colour below is written
       once as `light-dark(light, dark)`. No script, and the choice does not
       persist — that would need storage. Scoped to this page's own markup, so
       the other pages sharing style.css are untouched, and dropped whole on a
       browser without `light-dark()`, which leaves the light theme showing. */
    html{color-scheme:light}
    @supports (color:light-dark(#000,#fff)){
      html{color-scheme:light dark}
      html:has(#t-light:checked){color-scheme:light}
      html:has(#t-dark:checked){color-scheme:dark}
    }
    body{background:light-dark(#f7f9fa,#14171b);
         color:light-dark(#15191d,#e8ecf1)}
    body a{color:light-dark(#14507d,#7fb3e8)}
    body a:hover{color:light-dark(#0d3a5c,#a6cdf3)}
    body a:focus-visible{outline-color:light-dark(#14507d,#7fb3e8)}
    body header.site-header{border-bottom-color:light-dark(#dfe4e8,#2a3038)}
    body .lead{color:light-dark(#3b424a,#c6cdd6)}
    body main p,
    body main li{color:light-dark(#282d33,#e8ecf1)}
    body .meta{color:light-dark(#68717b,#99a3ae)}
    body footer.site-footer{border-top-color:light-dark(#dfe4e8,#2a3038);
      color:light-dark(#68717b,#99a3ae)}
    body footer.site-footer a{color:light-dark(#14507d,#7fb3e8)}

    /* The switch shares the top row with the back button. */
    .backnav{display:flex;align-items:center;justify-content:space-between;
      gap:1rem;padding:1rem 1.25rem 0}
    .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;
      clip:rect(0 0 0 0);white-space:nowrap}
    .themeswitch{position:relative;display:inline-grid;flex:none;
      grid-template-columns:repeat(3,1fr);width:max-content;align-items:center;
      padding:3px;border-radius:999px;overflow:hidden;
      border:1px solid light-dark(#c3ced9,#39424d);
      background:light-dark(#eef2f6,#20262d);
      transition:background .3s ease,border-color .3s ease}
    .themeswitch:hover{border-color:light-dark(#14507d,#7fb3e8)}
    .themeswitch input{position:absolute;width:1px;height:1px;overflow:hidden;
      clip:rect(0 0 0 0);white-space:nowrap}
    .themeswitch label{position:relative;z-index:1;display:flex;
      align-items:center;justify-content:center;
      padding:.3rem .62rem;border-radius:999px;cursor:pointer}
    .themeswitch svg{width:19px;height:19px;flex:none;
      color:light-dark(#98a1ac,#6c757f);transition:color .3s ease}
    .themeswitch input:focus-visible + label{
      outline:2px solid light-dark(#14507d,#7fb3e8);outline-offset:-2px}
    #t-dark:checked + label svg{color:#e2c979}
    #t-sys:checked + label svg{color:light-dark(#14507d,#7fb3e8)}
    #t-light:checked + label svg{color:#a8730a}
    .knob{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;
      width:calc((100% - 6px)/3);border-radius:999px;
      background:light-dark(#ffffff,#323b46);
      box-shadow:0 1px 3px light-dark(rgba(20,60,100,.3),rgba(0,0,0,.5));
      transition:transform .34s cubic-bezier(.22,.61,.36,1),background .3s ease}
    #t-dark:checked ~ .knob{transform:translateX(0)}
    #t-sys:checked ~ .knob{transform:translateX(100%)}
    #t-light:checked ~ .knob{transform:translateX(200%)}
  </style>
</head>
<body>
  <nav class="backnav" aria-label="Back"><a class="backbtn" href="/" data-back><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Back</a>
    <div class="themeswitch" role="radiogroup" aria-label="Colour theme">
      <input type="radio" name="theme" id="t-dark" autocomplete="off">
      <label for="t-dark" title="Dark theme"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.7 14.6A8.6 8.6 0 0 1 9.4 3.3a8.7 8.7 0 1 0 11.3 11.3z"/></svg><span class="visually-hidden">Dark</span></label>
      <input type="radio" name="theme" id="t-sys" autocomplete="off" checked>
      <label for="t-sys" title="Match my system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.6" y="4" width="18.8" height="12.4" rx="2"/><path d="M9 20.5h6M12 16.4v4.1"/></svg><span class="visually-hidden">Match my system</span></label>
      <input type="radio" name="theme" id="t-light" autocomplete="off">
      <label for="t-light" title="Light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg><span class="visually-hidden">Light</span></label>
      <span class="knob" aria-hidden="true"></span>
    </div>
  </nav>
  <div class="wrap">
    <header class="site-header">
      <h1>Music</h1>
      <nav class="site-nav" aria-label="Primary">
        <a href="/"><svg class="ico" viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M8 0L0 6V8H1V15H4V10H7V15H15V8H16V6L14 4.5V1H11V2.25L8 0ZM9 10H12V13H9V10Z"/></svg>Home</a>
        <a href="/community.html">Community</a>
      </nav>
    </header>

    <main>
      <p>
        <a class="ytbtn" href="https://www.youtube.com/@oisinmcgrath1916">
          <img src="/music/youtube.png" alt="">Watch on YouTube
        </a>
      </p>

      <a class="shot" href="https://www.youtube.com/@oisinmcgrath1916">
        <img src="/music/channel.jpg" alt="The Oisín Mac Craith YouTube channel">
      </a>

    </main>

    <footer class="site-footer">
      <p>© 2026 Oisin McGrath</p>
      <p>No tracking on this page.</p>
    </footer>
  </div>
  <script src="/back.js" defer></script>
</body>
</html>
